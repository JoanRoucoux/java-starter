spring:
  application:
    name: starter-api
  mvc:
    problemdetails:
      enabled: true
  # module:schema
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only
      # module:kafka
      start:
        skip: never
      # /module:kafka
  # module:kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 250
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        linger.ms: 0
  # /module:kafka
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # /module:schema
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          audiences: ${JWT_AUDIENCE}

app:
  client:
    market-data:
      base-url: ${MARKET_DATA_BASE_URL}
      connect-timeout: 2s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false

logging:
  expect-correlation-id: true
  structured:
    json:
      stacktrace:
        root: first
        max-length: 8192
