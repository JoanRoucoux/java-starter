version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directories:
      - /starter-api
      # module:batch
      - /starter-batch
      # /module:batch
      # module:kafka
      - /starter-kafka
      # /module:kafka
      # module:schema
      - /starter-schema
      # /module:schema
    schedule:
      interval: weekly
    groups:
      images:
        patterns:
          - '*'
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
      - dependency-name: maven
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
    groups:
      images:
        patterns:
          - '*'
