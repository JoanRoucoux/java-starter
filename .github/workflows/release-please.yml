name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The poms intentionally stay at 0.1.0-SNAPSHOT (generated apps are not published
          # to a Maven registry): the starter itself is versioned through version.txt.
          release-type: simple
