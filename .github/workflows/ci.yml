name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Check formatting
        run: ./mvnw -ntp -B spotless:check

      # Unit tests, ArchUnit rules, integration tests (Testcontainers), coverage check.
      - name: Verify
        run: ./mvnw -ntp -B verify

  # Guards against drift between the starter and its generator manifest/templates
  # (generator.config.json, .generator/): generates applications from this working tree with
  # starter-generator and runs their own quality gates. Both ends of the module matrix are
  # exercised, because the variant without the schema module is a different set of files.
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            modules: schema,batch
          - variant: minimal
            modules: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Fetch starter-generator
        run: |
          git clone --depth 1 https://github.com/JoanRoucoux/starter-generator "$RUNNER_TEMP/starter-generator"
          pnpm install --frozen-lockfile --dir "$RUNNER_TEMP/starter-generator"

      # A different base package exercises the package renames and empty-directory pruning;
      # the multi-word app name (ci-check) exercises the module renames.
      - name: Generate an app from this working tree
        run: >
          node "$RUNNER_TEMP/starter-generator/index.mjs" "$RUNNER_TEMP/generated/ci-check"
          --template . --title "CI Check" --base-package com.acme.cicheck
          --modules "${{ matrix.modules }}" --skip-install --skip-git --yes

      # No placeholder identity and no leftover generator marker may survive a generation.
      - name: Check for leftovers
        working-directory: ${{ runner.temp }}/generated/ci-check
        run: |
          # The [^a-z-] guard keeps Spring's own spring-boot-starter-* artifacts out of the match.
          if grep -rnE --exclude-dir=target 'com\.example\.starter|(^|[^a-z-])starter-(domain|adapter|api|schema|batch|aggregator)|module:(schema|batch)' .; then
            echo '::error::placeholder identity or generator marker left in the generated app'
            exit 1
          fi

      # Mirrors the generator's postInstall step (skipped above with --skip-install).
      - name: Format the generated app
        working-directory: ${{ runner.temp }}/generated/ci-check
        run: |
          chmod +x mvnw
          ./mvnw -ntp -B spotless:apply

      - name: Check the generated app (format, tests, architecture, build)
        working-directory: ${{ runner.temp }}/generated/ci-check
        run: |
          ./mvnw -ntp -B spotless:check
          ./mvnw -ntp -B verify
