name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Check formatting
        run: ./mvnw -ntp -B spotless:check

      - name: Verify
        run: ./mvnw -ntp -B verify

  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            modules: schema,batch,kafka
          - variant: minimal
            modules: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Fetch starter-generator
        run: |
          git clone --depth 1 https://github.com/JoanRoucoux/starter-generator "$RUNNER_TEMP/starter-generator"
          pnpm install --frozen-lockfile --dir "$RUNNER_TEMP/starter-generator"

      - name: Generate an app from this working tree
        run: >
          node "$RUNNER_TEMP/starter-generator/index.mjs" "$RUNNER_TEMP/generated/ci-check"
          --template . --title "CI Check" --base-package com.acme.cicheck
          --modules "${{ matrix.modules }}" --skip-install --skip-git --yes

      - name: Check for leftovers
        working-directory: ${{ runner.temp }}/generated/ci-check
        run: |
          if grep -rnE --exclude-dir=target 'com\.example\.starter|(^|[^a-z-])starter-(domain|adapter|api|schema|batch|kafka|aggregator)|module:(schema|batch|kafka)' .; then
            echo '::error::placeholder identity or generator marker left in the generated app'
            exit 1
          fi

      - name: Format the generated app
        working-directory: ${{ runner.temp }}/generated/ci-check
        run: |
          chmod +x mvnw
          ./mvnw -ntp -B spotless:apply

      - name: Check the generated app (format, tests, architecture, build)
        working-directory: ${{ runner.temp }}/generated/ci-check
        run: |
          ./mvnw -ntp -B spotless:check
          ./mvnw -ntp -B verify

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, batch, kafka, schema]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the ${{ matrix.module }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: starter-${{ matrix.module }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  ci:
    if: always()
    needs: [verify, generate, docker, actionlint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
