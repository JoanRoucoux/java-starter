name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to 21: palantir-java-format (Spotless) calls javac internals that changed in JDK 25.
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check formatting
        run: ./mvnw -ntp -B spotless:check

      # Unit tests, ArchUnit rules, integration tests (Testcontainers), coverage check.
      - name: Verify
        run: ./mvnw -ntp -B verify
