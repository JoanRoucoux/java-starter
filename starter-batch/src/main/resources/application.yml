spring:
  application:
    name: starter-batch
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only
      # module:kafka
      start:
        skip: never
      # /module:kafka
  # module:kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 250
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        linger.ms: 0
  # /module:kafka
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

app:
  client:
    market-data:
      base-url: http://localhost:8082
      connect-timeout: 2s
      read-timeout: 5s

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: false

logging:
  expect-correlation-id: true
  structured:
    json:
      stacktrace:
        root: first
        max-length: 8192
