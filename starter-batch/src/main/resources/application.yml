spring:
  application:
    name: starter-batch
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

app:
  client:
    market-data:
      base-url: http://localhost:8082
      connect-timeout: 2s
      read-timeout: 5s
